name: CI

# 必须保留 workflow_dispatch：worker 的 prebuild CI gate 会以
# path=.github/workflows/ci.yml + event=workflow_dispatch 查询最近一次成功的运行。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build migrations
        run: npm run build:migrations

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Security check
        run: npm run security:check
