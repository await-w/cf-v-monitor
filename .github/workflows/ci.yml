name: CI

# workflow_dispatch 必须保留：Cloudflare Workers Builds 的 prebuild CI gate
# 会以 path=.github/workflows/ci.yml + event=workflow_dispatch 查询最近一次成功的运行。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build migrations
        run: npm run build:migrations

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Agent tests
        run: cd agent && go test ./...

      # 注意：不能写 `node --test <目录>`，该形式会被当成模块路径解析。
      # 这里显式展开成文件列表，并排除 scripts/ 与 agent/ 下的
      # workflow 自审计用例（那些校验上游 CI/发布配置，与部署无关）。
      - name: Frontend and worker tests
        run: |
          mapfile -t files < <(find frontend/src frontend/test worker/src worker/test -name '*.test.mjs' -print)
          echo "测试文件数: ${#files[@]}"
          node --test "${files[@]}"
